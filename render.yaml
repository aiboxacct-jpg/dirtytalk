services:
  - type: web
    name: whisper-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SITE_NAME
        value: Whisper
      - key: SESSION_SECRET
        generateValue: true
      # Persistent storage (free Turso DB). Values are entered in the Render
      # dashboard at deploy time, not stored in this file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
